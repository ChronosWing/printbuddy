name: Fork release images (GHCR)

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish fork release images
    if: ${{ github.repository == 'ChronosWing/printbuddy' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release source and version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Stable releases require a version tag such as v0.2.5.4."
            exit 1
          fi
          python scripts/app_version.py --expected "${tag#v}"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Release tag must point to the current main commit."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chronoswing/printbuddy
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Docker updater metadata
        id: updater-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chronoswing/printbuddy-updater
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push Printbuddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PRINTBUDDY_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Printbuddy updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.updater-meta.outputs.tags }}
          labels: ${{ steps.updater-meta.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
